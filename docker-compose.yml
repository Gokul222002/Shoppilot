version: '3.8'

services:
  # Redis task broker & cache
  redis:
    image: redis:7-alpine
    container_name: shoppilot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ShopPilot FastAPI Backend & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoppilot-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HEADLESS=true
      - ENABLE_PURCHASE_PREVENTION=true
    depends_on:
      - redis
    restart: unless-stopped

  # Celery Asynchronous Distributed Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoppilot-worker
    command: celery -A app.worker.celery_worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HEADLESS=true
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # Next.js Command Center Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shoppilot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/agent
    depends_on:
      - backend
    restart: unless-stopped
