name: ShopPilot CI (Lint, Types, Tests, Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Python Syntax & Lint Check
        run: |
          cd backend
          python -m flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Test Suites (Phases A through G)
        run: |
          cd backend
          pytest tests/test_phase_c.py tests/test_phase_d.py tests/test_phase_e.py tests/test_phase_f.py tests/test_phase_g.py tests/test_typo_search.py tests/test_connectors.py tests/test_matching.py -v

  frontend-build:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_APP_URL: https://shoppilot.in
