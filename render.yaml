# Render Blueprint Specification for ShopPilot (Phase G Production Ready)
version: "1"

databases:
  - name: shoppilot-postgres
    databaseName: shoppilot
    user: shoppilot_user
    plan: free
    region: singapore

services:
  # 1. Backend FastAPI Price Comparison API Service
  - type: web
    name: shoppilot-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shoppilot-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: "https://shoppilot-frontend-fo5e.onrender.com"
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: USE_MOCK_DATA
        value: "true"
      - key: PRIMARY_CONNECTOR
        value: "mock"
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "ShopPilotAlertsBot"
      - key: AMAZON_PAAPI_KEY
        sync: false
      - key: AMAZON_PAAPI_SECRET
        sync: false
      - key: AMAZON_ASSOCIATE_TAG
        sync: false
      - key: FLIPKART_AFFILIATE_ID
        sync: false
      - key: FLIPKART_AFFILIATE_TOKEN
        sync: false

  # 2. Frontend Next.js Modern UI Service
  - type: web
    name: shoppilot-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://shoppilot-backend-jts2.onrender.com"
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://shoppilot-backend-jts2.onrender.com"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://shoppilot-frontend-fo5e.onrender.com"
      - key: NEXT_PUBLIC_ADMIN_KEY
        fromService:
          name: shoppilot-backend
          type: web
          envVarKey: ADMIN_SECRET_KEY
